# electron-builder.yml
# macOS Distribution Configuration for MarkuprX
# Version: 0.4.0

appId: com.eddiesanjuan.markuprx
productName: MarkuprX
executableName: MarkuprX
copyright: Copyright 2026 Eddie San Juan

directories:
  output: release
  buildResources: build

# Rebuild native modules for Electron's Node.js version
npmRebuild: true

files:
  - dist/**/*
  - package.json

extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
  # Windows taskbar icons (overlay and thumbnail toolbar)
  - from: build
    to: build
    filter:
      - "overlay-*.png"
      - "toolbar-*.png"

# whisper.cpp is executed as a child process and its Metal shader is loaded at
# runtime, so both files must live outside the read-only app.asar archive.
asarUnpack:
  - "node_modules/whisper-node/lib/whisper.cpp/main*"
  - "node_modules/whisper-node/lib/whisper.cpp/ggml-metal.metal"

beforePack: scripts/prepare-whisper-runtime.cjs

# =============================================================================
# macOS Configuration
# =============================================================================
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Hide from dock and Cmd+Tab - pure menu bar app
  extendInfo:
    LSUIElement: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

# =============================================================================
# DMG Installer Configuration
# =============================================================================
dmg:
  background: build/dmg-background.png
  iconSize: 100
  iconTextSize: 12
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications
  title: "Install MarkuprX ${arch}"
  artifactName: "markuprx-${version}-${arch}.dmg"

# =============================================================================
# Windows Configuration
# =============================================================================
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  publisherName: "MarkuprX"
  verifyUpdateCodeSignature: false
  # File associations
  fileAssociations:
    - ext: markuprx
      name: MarkuprX Session
      description: MarkuprX feedback session file
      icon: build/icon.ico
      role: Editor

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installer-header.bmp
  installerSidebar: build/installer-sidebar.bmp
  license: LICENSE
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "MarkuprX"
  artifactName: "markuprx-Setup-${version}.exe"
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

# =============================================================================
# Linux Configuration (for future use)
# =============================================================================
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build/icons

# =============================================================================
# Code Signing & Notarization
# =============================================================================
afterSign: scripts/notarize.cjs

# =============================================================================
# Publishing Configuration
# =============================================================================
publish:
  provider: github
  owner: eddiesanjuan
  repo: markuprx
  releaseType: release
