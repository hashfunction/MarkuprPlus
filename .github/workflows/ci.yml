# =============================================================================
# markuprx CI Pipeline
# =============================================================================
# Runs on every pushed commit and every pull request targeting main
# Matrix build for macOS and Windows with comprehensive validation
# =============================================================================

name: CI

on:
  push:
  pull_request:
    branches: [main]

# Preserve a complete result for every pushed commit.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # Lint & Type Check (fast feedback)
  # ===========================================================================
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify CI workflow coverage
        run: npm run verify:ci

      - name: Verify public brand and repository references
        run: npm run verify:brand

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ===========================================================================
  # Test Suite
  # ===========================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Coverage summary
        run: |
          SUMMARY=$(node -e "
            const r = require('./coverage/coverage-summary.json').total;
            const fmt = (m) => m.pct.toFixed(1) + '%';
            console.log('| Metric | Coverage |');
            console.log('|--------|----------|');
            console.log('| Statements | ' + fmt(r.statements) + ' |');
            console.log('| Branches   | ' + fmt(r.branches) + ' |');
            console.log('| Functions  | ' + fmt(r.functions) + ' |');
            console.log('| Lines      | ' + fmt(r.lines) + ' |');
          ")
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          LINES_PCT=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          # Pick badge color
          COLOR="red"
          if (( $(echo "$LINES_PCT >= 80" | bc -l) )); then COLOR="brightgreen"
          elif (( $(echo "$LINES_PCT >= 60" | bc -l) )); then COLOR="green"
          elif (( $(echo "$LINES_PCT >= 40" | bc -l) )); then COLOR="yellowgreen"
          elif (( $(echo "$LINES_PCT >= 20" | bc -l) )); then COLOR="yellow"
          elif (( $(echo "$LINES_PCT >= 10" | bc -l) )); then COLOR="orange"
          fi
          mkdir -p /tmp/badges
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${LINES_PCT}%\",\"color\":\"${COLOR}\"}" \
            > /tmp/badges/coverage.json
          # Push to badges branch
          cd /tmp/badges
          git init
          git checkout -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update coverage badge: ${LINES_PCT}%"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  # ===========================================================================
  # Real Electron UI & Media Pipeline
  # ===========================================================================
  electron-ui:
    name: Electron UI (macOS)
    runs-on: macos-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build Electron application
        run: npm run build:desktop

      - name: Run real Electron UI tests
        run: npm run test:ui-electron

      - name: Upload Electron UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: markuprx-electron-ui-diagnostics
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Build Matrix (macOS & Windows)
  # ===========================================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            artifact-name: markuprx-macos
            build-path: release/*.dmg
          - os: windows-latest
            artifact-name: markuprx-windows
            build-path: release/*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run macOS-specific tests
        if: runner.os == 'macOS'
        run: npx vitest run tests/unit/masIconGeneration.test.ts

      - name: Run Windows-specific tests
        if: runner.os == 'Windows'
        run: npx vitest run tests/unit/ai/cliProcessRunner.test.ts

      # Cache Electron binaries
      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Build application
        run: npm run build

      # Build unsigned packages for CI validation (--publish never to skip GH_TOKEN requirement)
      - name: Package application (unsigned)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never --config electron-builder.yml
          else
            npx electron-builder --win --publish never --config electron-builder.yml
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder otherwise hard-links app files on CI. The next
          # architecture rebuild can then overwrite native modules already
          # copied into the first macOS package.
          USE_HARD_LINKS: 'false'

      - name: Verify packaged native runtime
        run: npm run verify:package

      - name: Smoke test packaged application
        run: npm run test:package-smoke

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Build Status Summary
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [validate, test, electron-ui, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.electron-ui.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
