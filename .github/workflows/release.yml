# =============================================================================
# MarkuprPlus Release Pipeline
# =============================================================================
# Triggered on version tags (v*)
# Builds signed installers for macOS and Windows
# Creates GitHub Release with changelog and assets
#
# macOS artifacts are signed with a Developer ID Application certificate,
# notarized by Apple, and stapled. The job fails rather than publishing an
# artifact that Gatekeeper would block, so a release can never silently ship
# an app that users cannot open.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

env:
  # @electron/notarize requires Node >= 22.12.
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # Validate Release Tag
  # ===========================================================================
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

          # Check if this is a prerelease (alpha, beta, rc)
          if [[ "$TAG_VERSION" =~ (alpha|beta|rc) ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Release version: $TAG_VERSION"

      - name: Validate version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${{ steps.version.outputs.version }}

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

  # ===========================================================================
  # Build macOS (Intel + Apple Silicon)
  # ===========================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: validate-tag
    env:
      # Signing
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      # Notarization - App Store Connect API key (preferred)
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Notarization - Apple ID + app-specific password (fallback)
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # A tagged release must never produce an unnotarized artifact.
      MARKUPRX_REQUIRE_NOTARIZATION: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Fail early and legibly rather than 20 minutes into a build that would
      # have produced an app Gatekeeper blocks.
      - name: Require Apple signing and notarization credentials
        run: |
          missing=()
          [ -n "$APPLE_CERTIFICATE" ] || missing+=("APPLE_CERTIFICATE (base64 .p12 of the Developer ID Application certificate)")
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing+=("APPLE_CERTIFICATE_PASSWORD (export password of that .p12)")

          # Either notarization credential set is acceptable.
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            echo "Notarization credentials: App Store Connect API key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Notarization credentials: Apple ID + app-specific password"
          else
            missing+=("notarization credentials: either APPLE_API_KEY_P8 + APPLE_API_KEY_ID [+ APPLE_API_ISSUER], or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "::error::Cannot build a release: required macOS signing secrets are not configured."
              echo "Missing repository secrets:"
              for item in "${missing[@]}"; do echo "  - $item"; done
              echo ""
              echo "See SIGNING_INSTRUCTIONS.md. Without these the macOS build would be unsigned,"
              echo "and macOS would refuse to open it on any machine but the build runner."
            } >&2
            exit 1
          fi

          echo "All required macOS release credentials are present."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Electron binaries
      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: macos-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            macos-electron-

      - name: Build application
        run: npm run build

      # Import the Developer ID certificate into a throwaway keychain that is
      # discarded with the runner.
      - name: Install Apple signing certificate
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # The keychain is ephemeral, so a random password is fine when the
          # KEYCHAIN_PASSWORD secret is not set.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Keep the default login keychain searchable so the Apple intermediate
          # certificates still resolve while the signature chain is built.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          rm -f "$CERTIFICATE_PATH"

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Identities in the signing keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # An Apple Development or Apple Distribution certificate signs fine but
      # can never be notarized for distribution outside the Mac App Store.
      - name: Verify a Developer ID Application certificate is present
        run: |
          set -euo pipefail
          if ! security find-identity -v -p codesigning "$CSC_KEYCHAIN" | grep -q "Developer ID Application"; then
            {
              echo "::error::The APPLE_CERTIFICATE secret does not contain a 'Developer ID Application' certificate."
              echo "Apple only notarizes apps signed with 'Developer ID Application'."
              echo "'Apple Development' certificates are for local runs and 'Apple Distribution' certificates"
              echo "are for Mac App Store submission; neither can be distributed as a DMG."
              echo "Create one at https://developer.apple.com/account/resources/certificates"
            } >&2
            exit 1
          fi
          echo "Developer ID Application certificate found."

      # notarytool authenticates with a .p8 key file, so materialise it here and
      # hand scripts/notarize.cjs the path.
      - name: Stage App Store Connect API key
        if: ${{ env.APPLE_API_KEY_P8 != '' && env.APPLE_API_KEY_ID != '' }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          # Accept the secret either base64 encoded or as raw PEM text.
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode -o "$KEY_PATH"
          fi

          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Staged App Store Connect API key $APPLE_API_KEY_ID"

      # Signs both architectures, then scripts/notarize.cjs (afterSign) submits
      # each .app to Apple and staples the ticket before the DMG is assembled.
      - name: Package macOS (signed and notarized)
        run: npx electron-builder --mac --publish never --config electron-builder.yml

      - name: Verify package layout
        run: npm run verify:package

      # The .app inside the DMG is stapled, but the DMG itself is built after
      # the afterSign hook, so it needs its own ticket to validate offline.
      - name: Notarize and staple disk images
        run: npm run notarize:dmg

      # Final gate: refuse to upload anything Gatekeeper would reject.
      - name: Verify signatures, notarization, and stapling
        run: npm run verify:signing

      - name: List build artifacts
        run: ls -la release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Build Windows
  # ===========================================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate-tag
    env:
      WIN_SIGNING_AVAILABLE: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Electron binaries
      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            windows-electron-

      - name: Build application
        run: npm run build

      # Build and sign for Windows
      - name: Package Windows (signed)
        if: ${{ env.WIN_SIGNING_AVAILABLE == 'true' }}
        run: npx electron-builder --win --x64 --publish never --config electron-builder.yml
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Build unsigned if no signing credentials
      - name: Package Windows (unsigned)
        if: ${{ env.WIN_SIGNING_AVAILABLE != 'true' }}
        run: npx electron-builder --win --x64 --publish never --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Warn about unsigned Windows build
        if: ${{ env.WIN_SIGNING_AVAILABLE != 'true' }}
        run: echo "::warning::WIN_CSC_LINK is not configured. Windows installers are unsigned and SmartScreen will warn on download."

      - name: Verify package layout
        run: npm run verify:package

      - name: List build artifacts
        run: dir release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Build CLI/MCP companion package
  # ===========================================================================
  build-companion:
    name: Build CLI Companion
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and MCP entry points
        run: |
          npm run build:cli
          npm run build:mcp

      - name: Pack and verify companion
        run: |
          set -euo pipefail
          VERSION=${{ needs.validate-tag.outputs.version }}
          PACKAGE="markuprplus-${VERSION}.tgz"

          npm pack
          test -f "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -Fx 'package/dist/cli/index.mjs'
          tar -tzf "$PACKAGE" | grep -Fx 'package/dist/mcp/index.mjs'

          PACKED_VERSION=$(tar -xOf "$PACKAGE" package/package.json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version));")
          test "$PACKED_VERSION" = "$VERSION"

          PREFIX="$RUNNER_TEMP/companion-prefix"
          npm install --global --prefix "$PREFIX" "./$PACKAGE"
          test "$("$PREFIX/bin/markuprplus" --version)" = "$VERSION"

      - name: Upload companion artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-companion
          path: markuprplus-${{ needs.validate-tag.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build-macos, build-windows, build-companion]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display artifact structure
        run: find artifacts -type f | head -50

      - name: Generate release notes
        id: changelog
        run: |
          # Written to its own file so the curated CHANGELOG.md is left intact.
          NOTES=RELEASE_NOTES.md
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${{ github.ref_name }}
          VERSION=${{ needs.validate-tag.outputs.version }}

          echo "## What's Changed" > $NOTES
          echo "" >> $NOTES

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Changes since $PREVIOUS_TAG:" >> $NOTES
            echo "" >> $NOTES
            git log $PREVIOUS_TAG..$CURRENT_TAG --pretty=format:"- %s (%h)" --no-merges >> $NOTES
          else
            echo "Initial release" >> $NOTES
          fi

          echo "" >> $NOTES
          echo "" >> $NOTES
          echo "## Downloads" >> $NOTES
          echo "" >> $NOTES
          echo "| Platform | Download |" >> $NOTES
          echo "|----------|----------|" >> $NOTES
          echo "| macOS (Apple Silicon) | \`markuprplus-${VERSION}-arm64.dmg\` |" >> $NOTES
          echo "| macOS (Intel) | \`markuprplus-${VERSION}-x64.dmg\` |" >> $NOTES
          echo "| Windows | \`markuprplus-Setup-${VERSION}.exe\` |" >> $NOTES
          echo "| CLI / MCP companion | \`markuprx-${VERSION}.tgz\` |" >> $NOTES
          echo "" >> $NOTES
          echo "The macOS builds are signed with a Developer ID Application certificate," >> $NOTES
          echo "notarized by Apple, and stapled, so they open without a Gatekeeper warning." >> $NOTES
          echo "" >> $NOTES
          echo "## Checksums" >> $NOTES
          echo "" >> $NOTES
          echo "\`\`\`" >> $NOTES
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o -name "*.tgz" \) -exec sha256sum {} \; >> $NOTES
          echo "\`\`\`" >> $NOTES

          cat $NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MarkuprPlus v${{ needs.validate-tag.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.is-prerelease == 'true' }}
          files: |
            artifacts/release-macos/*.dmg
            artifacts/release-macos/*.zip
            artifacts/release-macos/*.blockmap
            artifacts/release-macos/*.yml
            artifacts/release-windows/*.exe
            artifacts/release-windows/*.msi
            artifacts/release-windows/*.zip
            artifacts/release-windows/*.blockmap
            artifacts/release-windows/*.yml
            artifacts/release-companion/*.tgz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify companion release asset
        run: |
          VERSION=${{ needs.validate-tag.outputs.version }}
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | grep -Fx "markuprplus-${VERSION}.tgz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.validate-tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Prerelease:** ${{ needs.validate-tag.outputs.is-prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "**macOS:** signed, notarized, and stapled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o -name "*.tgz" \) | while read f; do
            echo "- $(basename $f)" >> $GITHUB_STEP_SUMMARY
          done
