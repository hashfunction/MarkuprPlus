<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono {
            font-family: 'JetBrains+Mono', 'SF Mono', 'Menlo', monospace;
        }

        .ff-shell-bg {
            background: radial-gradient(circle at 0% 0%, rgba(10, 132, 255, 0.12), transparent 45%), radial-gradient(circle at 100% 100%, rgba(94, 106, 240, 0.08), transparent 40%), linear-gradient(180deg, #090c14 0%, #0c1018 60%, #0b0f16 100%);
        }
    </style>
</head>

<body>
    <div class="w-[2880px] h-[1800px] overflow-hidden relative ff-shell-bg text-[#eef3ff]" data-sd-id="1">
        <div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: linear-gradient(#96a2b738 1px, transparent 1px), linear-gradient(90deg, #96a2b738 1px, transparent 1px); background-size: 160px 160px;" data-sd-id="2"></div>
        <div class="absolute left-[160px] top-[160px] w-[900px] flex flex-col gap-8" data-sd-id="3"><span class="text-[#0a84ff] font-mono tracking-[0.2em] text-[24px] font-semibold uppercase" data-sd-id="4">YOUR WORDS, ALIGNED TO THE MOMENT</span>
            <h1 class="text-[112px] font-bold leading-[0.95] tracking-[-0.03em] max-w-[800px]" data-sd-id="5">Talk through bugs as you test.</h1>
            <p class="text-[#c6d0e3] text-[38px] leading-relaxed max-w-[700px] font-medium opacity-90" data-sd-id="6">Record narration with the screen, then transcribe on device with Whisper.</p>
        </div>
        <div class="absolute right-[0px] top-[120px] w-[1820px] h-[1560px] flex items-start gap-[80px]" data-sd-id="7">
            <div class="relative flex flex-col gap-[60px] transform translate-y-[100px]" data-sd-id="8">
                <div class="w-[640px] rounded-[32px] overflow-hidden border border-[#96a2b738] shadow-[0_80px_160px_rgba(0,0,0,0.6)] bg-gradient-to-b from-[#1a212d] to-[#161c27] transition-transform hover:scale-[1.02] duration-500" data-sd-id="9">
                    <div class="p-[12px] h-[940px] overflow-hidden" data-sd-id="10"><img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/c07a90e9-1ce8-4557-a725-09920dbb7137/content-assets/app-store-recording-settings/recording-settings.png" class="w-full h-full object-cover rounded-[20px]" alt="Recording Settings" data-sd-id="11"></div>
                    <div class="absolute -inset-px rounded-[32px] border border-white/5 pointer-events-none" data-sd-id="12"></div>
                </div>
            </div>
            <div class="relative flex flex-col gap-[60px]" data-sd-id="16">
                <div class="w-[640px] rounded-[32px] overflow-hidden border border-[#96a2b738] shadow-[0_100px_200px_rgba(0,0,0,0.7)] bg-gradient-to-b from-[#1a212d] to-[#161c27] transition-transform hover:scale-[1.02] duration-500" data-sd-id="17">
                    <div class="p-[12px] h-[940px] overflow-hidden" data-sd-id="18"><img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/c07a90e9-1ce8-4557-a725-09920dbb7137/content-assets/app-store-transcription/transcription.png" class="w-full h-full object-cover rounded-[20px]" alt="Transcription Settings" data-sd-id="19"></div>
                    <div class="absolute -inset-px rounded-[32px] border border-white/5 pointer-events-none" data-sd-id="20"></div>
                </div>
            </div>
        </div>
        <div class="absolute left-[160px] bottom-[100px] flex items-center gap-12" data-sd-id="24">
            <div class="flex items-center gap-6" data-sd-id="25">
                <div class="w-3 h-3 rounded-full bg-[#34c759]" data-sd-id="26"></div>
                <p class="text-[#8f9db5] text-[24px] font-medium" data-sd-id="27">Microphone optional</p>
            </div>
            <div class="w-[1px] h-8 bg-[#96a2b738]" data-sd-id="28"></div>
            <div class="flex items-center gap-6" data-sd-id="29">
                <div class="w-3 h-3 rounded-full bg-[#0a84ff]" data-sd-id="30"></div>
                <p class="text-[#8f9db5] text-[24px] font-medium" data-sd-id="31">Local transcription available</p>
            </div>
        </div>
    </div>
</body>

</html>
