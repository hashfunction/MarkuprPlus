# UNPUBLISHED REFERENCE ONLY: the retained markuprx-action path has no published
# repository/tag today. This workflow is intentionally disabled and will not run
# until a maintained Action is published and the reference is independently reviewed.
#
# Basic MarkuprPlus PR Feedback
# Analyzes screen recordings in ./recordings/ and posts a visual feedback report on the PR.
#
# Setup:
# 1. Add screen recordings to a recordings/ directory in your repo (or use Git LFS)
# 2. This workflow runs automatically on every PR

name: Visual Feedback

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  feedback:
    if: ${{ false }} # Remove only after the Action release is verified.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Analyze recordings and comment on PR
        uses: eddiesanjuan/markuprx-action@v1
        with:
          video-path: ./recordings/
          github-token: ${{ secrets.GITHUB_TOKEN }}
